[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "env-contract"
version = "0.1.0"
description = "Check environment contracts without exposing values."
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = []

[project.scripts]
env-contract = "env_contract.cli:main"

[tool.setuptools.packages.find]
include = ["env_contract*"]
